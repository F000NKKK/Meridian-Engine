# Meridian-Engine layer map: current crate names, intended layers.
# Each crate is mapped to the layer it is meant to be in, so `craftcheck deps`
# reports where today's code breaks it (baseline: .craftcheck-deps-baseline).
# Target crate names and the migration waves: Craftbook adoption/meridian-engine.md,
# decisions: docs/adr/019-ports-in-domain-drivers-as-adapters.md and
# docs/adr/020-craftbook-adoption.md. Contexts and edges: docs/context-map.md.
# scripts/check_dependency_rules.py reads the layers below (one source).

