[package]
name = "meridian-examples"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Example programs (magic_figures, physic_figures) and the shared plumbing they use; not published."
readme = "README.md"
publish = false

[dependencies]
meridian-sdk = { workspace = true, features = ["file-logging"] }
tokio = { workspace = true }

[build-dependencies]
meridian-mel-build = { workspace = true }

[[example]]
name = "magic_figures"
path = "examples/magic_figures/magic_figures.rs"

[[example]]
name = "physic_figures"
path = "examples/physic_figures/physic_figures.rs"

[lints]
workspace = true
