# Craftbook quality gates (Craftbook rust/08 §8.5, templates/ci.yml), adapted
# to Meridian during adoption (Craftbook adoption/meridian-engine.md):
# - the build needs ALSA headers (cpal -> alsa-sys);
# - tests that need a GPU or an audio device are behind the `hw-tests`
#   feature, so tests never run with --all-features here;
# - lints that still fire are "warn" in Cargo.toml; their counts are gated by
#   scripts/clippy_backlog.py against .clippy-backlog (may only shrink);
# - craftcheck runs against its baselines (may only shrink);
# - coverage is reported per crate; the per-layer thresholds are reported but
#   do not fail the job until each crate reaches them (thresholds only go up).
name: quality

on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: -D rustdoc::all
  # The Craftbook version this project follows; bumped by the project's own PR.
  CRAFTBOOK_REF: main
  # The clippy backlog counts warnings of this exact toolchain; bump both together.
  # Every feature except hw-tests.
  TEST_FEATURES: meridian-sdk/file-logging

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: F000NKKK/craftbook
          ref: ${{ env.CRAFTBOOK_REF }}
          path: .craftbook
          # Needed while Craftbook is private: a fine-grained token that can read it.
          token: ${{ secrets.CRAFTBOOK_TOKEN }}
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: dtolnay/rust-toolchain@1.97
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # Deny-level lints fail here; warn-level counts are gated by the backlog.
      - run: python3 scripts/clippy_backlog.py
      - run: ./build.sh check-deps
      - run: python3 .craftbook/tools/craftcheck check . --baseline .craftcheck-baseline
      - run: python3 .craftbook/tools/craftcheck deps . --baseline .craftcheck-deps-baseline

  fmt-nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Import grouping is not applied to the tree yet (Craftbook ch. 1 §1.7);
    # informational until a migration wave runs it once.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo +nightly fmt --all --check -- --config group_imports=StdExternalCrate,imports_granularity=Module

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: F000NKKK/craftbook
          ref: ${{ env.CRAFTBOOK_REF }}
          path: .craftbook
          token: ${{ secrets.CRAFTBOOK_TOKEN }}
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: dtolnay/rust-toolchain@1.97
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-deny
      - run: cargo test --workspace --no-fail-fast --features "$TEST_FEATURES"
      # llvm-cov on stable does not run doc tests; they run here.
      - run: cargo test --workspace --features "$TEST_FEATURES" --doc
      - name: coverage per crate
        run: cargo llvm-cov --workspace --features "$TEST_FEATURES" --summary-only
      - name: coverage threshold by layer (chapter 8 §8.1; reported during adoption)
        continue-on-error: true
        run: |
          set -u
          status=0
          gate() { # layer min-lines min-regions
            for crate in $(python3 .craftbook/tools/craftcheck crates . --layer "$1"); do
              case "$crate" in meridian-*) ;; *) continue ;; esac
              echo "== $crate ($1): lines >= $2 %, regions >= $3 %"
              cargo llvm-cov --package "$crate" --summary-only --fail-under-lines "$2" --fail-under-regions "$3" || status=1
            done
          }
          gate shared-kernel 95 90
          gate domain 90 85
          gate app 85 80
          gate infra 70 0
          exit $status
      - name: coverage of changed lines >= 90 % (pull requests; reported during adoption)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          set -eu
          packages=""
          for layer in shared-kernel domain app; do
            for crate in $(python3 .craftbook/tools/craftcheck crates . --layer "$layer"); do
              packages="$packages --package $crate"
            done
          done
          [ -n "$packages" ] || exit 0
          cargo llvm-cov $packages --lcov --output-path lcov.info
          pipx run diff-cover lcov.info --compare-branch "origin/${{ github.base_ref }}" --fail-under 90
      - run: cargo deny check
      - run: cargo doc --workspace --no-deps --all-features

  mutants:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: F000NKKK/craftbook
          ref: ${{ env.CRAFTBOOK_REF }}
          path: .craftbook
          token: ${{ secrets.CRAFTBOOK_TOKEN }}
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: dtolnay/rust-toolchain@1.97
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - name: mutation score per crate, threshold by layer (chapter 8 §8.1)
        run: |
          set -u
          status=0
          gate() { # layer min-score
            for crate in $(python3 .craftbook/tools/craftcheck crates . --layer "$1"); do
              cargo mutants --package "$crate" --timeout 120 --output "mutants-$crate" || true
              python3 .craftbook/tools/mutation_score.py "mutants-$crate/mutants.out/outcomes.json" "$2" || status=1
            done
          }
          gate shared-kernel 85
          gate domain 80
          gate app 70
          exit $status

  # No Miri job: the only unsafe code (platform-core's dynamic_library.rs)
  # calls dlopen/LoadLibrary, which Miri cannot execute.

  benches:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: dtolnay/rust-toolchain@1.97
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench --workspace --features "$TEST_FEATURES"

  # hw-tests (GPU and audio device) run only on a runner with the hardware:
  #   cargo test --workspace --all-features
