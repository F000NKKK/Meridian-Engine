[package]
name = "meridian-gac-wgpu"
version = "0.23.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Batch execution kernels for GAC transforms (Motor3) on CPU-SIMD / GPU compute. The adapter between the pure math in gac and the dispatch runtime in compute-app — neither depends on the other."
readme = "README.md"

[dependencies]
meridian-gac = { workspace = true }
meridian-compute-app = { workspace = true }
meridian-compute-wgpu = { workspace = true }
meridian-numeric = { workspace = true }
meridian-gpu-wgpu = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
criterion = { version = "0.8", default-features = false }

[features]
# Tests that need a real GPU or audio device; CI has neither (docs/adr/020).
hw-tests = []

[[bench]]
name = "batch_kernels"
harness = false

[lints]
workspace = true
