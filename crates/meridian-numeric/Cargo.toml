[package]
name = "meridian-numeric"
version = "0.8.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Scalar types, SIMD helpers, numeric traits and CPU feature dispatch underlying the GAC — kept separate so gac stays pure geometric algebra."
readme = "README.md"

[dependencies]
meridian-diagnostics = { workspace = true }
# The Substrate Data schema of `Fixed` (raw Q16.16 bits) — off by default so
# no math crate pulls the data library unless an application asks for it.
# See docs/data-formats.md.
substrate-data = { workspace = true, optional = true }

[features]
data = ["dep:substrate-data"]

[lints]
workspace = true

[dev-dependencies]
proptest = "1"
