[package]
name = "meridian-runtime-threads"
version = "0.7.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Job graph scheduler: worker threads and dependency tracking for parallel frame execution, and the runtime-app JobExecutor adapter."
readme = "README.md"

[dependencies]
meridian-asset-app = { workspace = true }
meridian-runtime-app = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
meridian-runtime-app = { workspace = true, features = ["testing"] }
criterion = { version = "0.8", default-features = false }

[[bench]]
name = "task_core"
harness = false
