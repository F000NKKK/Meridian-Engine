[package]
name = "meridian-sdk"
version = "0.5.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Single application-facing entry point: re-exports everything an app needs (gac-core/physics-core/audio-core/graphics-core/graphics-driver/platform-core/asset-core/engine-core types) plus its own composable job-graph pipeline and windowed-app scaffolding (scene/camera helpers). Applications depend on this crate alone, never on the individual crates it composes."
readme = "README.md"

[dependencies]
meridian-foundation = { workspace = true }
meridian-gac-core = { workspace = true }
meridian-platform-core = { workspace = true }
meridian-asset-core = { workspace = true }
meridian-asset-png = { workspace = true }
meridian-asset-symphonia = { workspace = true }
meridian-graphics-driver = { workspace = true }
meridian-rendering-app = { workspace = true }
meridian-graphics-core = { workspace = true }
meridian-physics-core = { workspace = true }
meridian-audio-core = { workspace = true }
meridian-audio-app = { workspace = true }
meridian-audio-driver = { workspace = true }
meridian-diagnostics-fs = { workspace = true }
meridian-engine-core = { workspace = true }
meridian-physics-app = { workspace = true }
meridian-physics-compute = { workspace = true }
meridian-task-core = { workspace = true }
meridian-compute-driver = { workspace = true }
meridian-compute-runtime = { workspace = true }
meridian-dsl-core = { workspace = true }
meridian-dsl-macros = { workspace = true }
meridian-ui-core = { workspace = true }

[dev-dependencies]
png = { workspace = true }

[lints]
workspace = true
