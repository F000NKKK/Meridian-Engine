[package]
name = "meridian-sdk"
version = "0.5.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Single application-facing entry point: re-exports everything an app needs (gac/physics-domain/audio-domain/rendering-domain/rendering-wgpu/platform-winit/asset-domain/runtime-app types) plus its own composable job-graph pipeline and windowed-app scaffolding (scene/camera helpers). Applications depend on this crate alone, never on the individual crates it composes."
readme = "README.md"

[dependencies]
meridian-diagnostics = { workspace = true }
meridian-gac = { workspace = true }
meridian-platform-winit = { workspace = true }
meridian-asset-app = { workspace = true }
meridian-asset-domain = { workspace = true }
meridian-asset-fs = { workspace = true }
meridian-asset-http = { workspace = true }
meridian-asset-png = { workspace = true }
meridian-asset-gltf = { workspace = true }
meridian-asset-symphonia = { workspace = true }
meridian-rendering-wgpu = { workspace = true }
meridian-rendering-app = { workspace = true }
meridian-rendering-domain = { workspace = true }
meridian-physics-domain = { workspace = true }
meridian-audio-domain = { workspace = true }
meridian-audio-app = { workspace = true }
meridian-audio-cpal = { workspace = true }
meridian-diagnostics-fs = { workspace = true }
meridian-runtime-app = { workspace = true }
meridian-physics-app = { workspace = true }
meridian-physics-wgpu = { workspace = true }
meridian-runtime-threads = { workspace = true }
meridian-compute-wgpu = { workspace = true }
meridian-compute-app = { workspace = true }
meridian-markup = { workspace = true }
meridian-markup-macros = { workspace = true }
meridian-ui-domain = { workspace = true }

[dev-dependencies]
png = { workspace = true }
meridian-rendering-app = { workspace = true, features = ["testing"] }

[lints]
workspace = true
