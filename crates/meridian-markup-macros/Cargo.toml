[package]
name = "meridian-markup-macros"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "#[dsl_tag] attribute macro implementing meridian_markup::DslTag for a struct — the code-generation half of the SDK's extensible scene DSL; see meridian-markup for the trait and meridian-sdk::dsl for the registry it feeds."
readme = "README.md"

[lib]
proc-macro = true

[dependencies]
syn = { version = "3", features = ["full"] }
quote = "1"
proc-macro2 = "1"
proc-macro-crate = "3"

[lints]
workspace = true
