[package]
name = "meridian-data-substrate"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Scene serialization on Substrate Data: an application-built component registry, the .mscene document schema, and World load/save with line/column/path diagnostics."
readme = "README.md"

[dependencies]
meridian-ecs = { workspace = true }
# `Motor3`'s schema, for `Transform` (registered through a codec here, so
# ecs itself never learns about files).
meridian-gac = { workspace = true, features = ["data"] }
substrate-data = { workspace = true }
thiserror = { workspace = true }
