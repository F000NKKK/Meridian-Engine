[package]
name = "meridian-compute-driver"
version = "0.18.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Low-level compute dispatch abstraction (CPU SIMD backends, GPU compute queues/buffers). Knows nothing about physics, animation or rendering."
readme = "README.md"

[dependencies]
meridian-compute-runtime = { workspace = true }
meridian-platform-core = { workspace = true }
meridian-gpu-driver = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
meridian-compute-runtime = { workspace = true, features = ["testing"] }

[features]
# Tests that need a real GPU or audio device; CI has neither (docs/adr/020).
hw-tests = []

[lints]
workspace = true
