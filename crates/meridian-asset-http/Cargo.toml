[package]
name = "meridian-asset-http"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "HTTP adapter for asset-app: reads asset bytes from a web server over plain http."
readme = "README.md"

[dependencies]
meridian-asset-app = { workspace = true }
percent-encoding = "2"
thiserror = { workspace = true }
# No TLS: `ureq`'s `rustls` brings `ring`, whose licence deny.toml does not allow (ADR 028).
ureq = { version = "3", default-features = false }

[lints]
workspace = true
