[package]
name = "meridian-gac-core"
version = "0.12.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Geometric Algebra Core — vectors, bivectors, multivectors, rotors and motors; the shared spatial math foundation for every other subsystem."
readme = "README.md"

[dependencies]
meridian-numeric-core = { workspace = true }
# Substrate Data schemas for the GA types (`data` feature) — off by default,
# like a `serde` feature: no math crate depends on the data library unless
# an application asks. See docs/data-formats.md ("Math values").
substrate-data = { workspace = true, optional = true }

[features]
data = ["dep:substrate-data", "meridian-numeric-core/data"]

[lints]
workspace = true

[dev-dependencies]
criterion = { version = "0.8", default-features = false }
proptest = "1"

[[bench]]
name = "gac_core"
harness = false
