[package]
name = "meridian-ui-render"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Turns a laid-out meridian-ui-core element tree into a graphics-core Scene2d: backgrounds and text today, images next. No GPU, no windowing; see ADR 021."

[dependencies]
meridian-font-core = { workspace = true }
meridian-gac-core = { workspace = true }
meridian-graphics-core = { workspace = true }
meridian-ui-core = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
meridian-font-core = { workspace = true, features = ["synthetic-font"] }
meridian-memory-core = { workspace = true }
meridian-resource-core = { workspace = true }

[lints]
workspace = true
