[package]
name = "meridian-rendering-wgpu"
version = "0.18.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Low-level GPU abstraction (device, command queues, buffers, textures, shaders, pipelines, synchronization). Knows nothing about scenes or materials."
readme = "README.md"

[dependencies]
meridian-diagnostics = { workspace = true }
meridian-gac = { workspace = true }
meridian-rendering-domain = { workspace = true }
meridian-rendering-app = { workspace = true }
meridian-memory = { workspace = true }
meridian-asset-domain = { workspace = true }
meridian-platform-winit = { workspace = true }
meridian-gpu-wgpu = { workspace = true }
tokio = { workspace = true }
wgpu = { workspace = true }

[dev-dependencies]
meridian-rendering-app = { workspace = true, features = ["testing"] }

[features]
# Tests that need a real GPU or audio device; CI has neither (docs/adr/020).
hw-tests = []

[lints]
workspace = true
